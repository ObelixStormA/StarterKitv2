services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: starterkit_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=starterkit
      - DB_USERNAME=starterkit
      - DB_PASSWORD=secret
      - QUEUE_CONNECTION=database
    depends_on:
      - db
    networks:
      - starterkit

  nginx:
    image: nginx:alpine
    container_name: starterkit_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/public
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - starterkit

  db:
    image: postgres:16-alpine
    container_name: starterkit_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=starterkit
      - POSTGRES_USER=starterkit
      - POSTGRES_PASSWORD=secret
    volumes:
      - starterkit_db_data:/var/lib/postgresql/data
    networks:
      - starterkit

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: starterkit_queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./storage:/var/www/html/storage
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=starterkit
      - DB_USERNAME=starterkit
      - DB_PASSWORD=secret
      - QUEUE_CONNECTION=database
    depends_on:
      - db
    networks:
      - starterkit

networks:
  starterkit:

volumes:
  starterkit_db_data:
